<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUEZ STREAM | Home Media Server</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome للإيقونات -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- إعدادات مخصصة لتصميم الـ Glassmorphism -->
    <style>
        /* خلفية المنصة */
        body {
            /* يمكنك تغيير رابط الخلفية لاحقاً أو جعلها مظلمة سادة */
            background: url('https://images.unsplash.com/photo-1603366636622-398205c3b392?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* الطبقة الداكنة فوق الخلفية */
        .bg-overlay {
            background: linear-gradient(to left, rgba(2, 6, 23, 0.95), rgba(15, 23, 42, 0.85));
            position: fixed;
            inset: 0;
            z-index: -1;
        }

        /* تأثير الزجاج (Glassmorphism) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }

        .glass-nav {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* تخصيص شريط التمرير */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        /* تأثيرات الكروت (Cards) */
        .movie-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .play-overlay {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .movie-card:hover .play-overlay {
            opacity: 1;
        }
    </style>
</head>

<body class="text-white min-h-screen relative overflow-x-hidden">
    <!-- خلفية المنصة الداكنة -->
    <div class="bg-overlay"></div>

    <!-- شريط التنقل العلوي -->
    <nav class="glass-nav fixed w-full top-0 z-50 px-6 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 p-2 rounded-lg shadow-[0_0_15px_rgba(37,99,235,0.5)]">
                <i class="fa-solid fa-network-wired text-xl"></i>
            </div>
            <h1
                class="text-2xl font-bold tracking-wider bg-clip-text text-transparent bg-gradient-to-l from-blue-400 to-purple-500">
                SUEZ STREAM
            </h1>
        </div>

        <!-- قسم البحث والفلترة -->
        <div class="flex items-center gap-4">
            <div class="relative hidden md:block">
                <input type="text" id="searchInput" placeholder="ابحث في المكتبة المحلية..."
                    class="glass-panel py-2 px-4 pr-10 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-64 text-white placeholder-gray-400 transition-all duration-300">
                <i class="fa-solid fa-search absolute right-3 top-2.5 text-gray-400"></i>
            </div>
            <button id="rescanBtn"
                class="glass-panel p-2 px-4 hover:bg-white/10 transition flex items-center gap-2 text-sm font-semibold">
                <i class="fa-solid fa-rotate"></i> فحص الشبكة
            </button>
        </div>
    </nav>

    <!-- المحتوى الرئيسي (شبكة الميديا) -->
    <main class="container mx-auto px-6 pt-28 pb-12">
        <!-- مؤشر التحميل (يظهر أثناء فحص الراوتر) -->
        <div id="loadingStatus"
            class="hidden mb-8 glass-panel p-4 flex items-center justify-between border-l-4 border-blue-500">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-circle-notch fa-spin text-blue-400 text-xl"></i>
                <p id="loadingText" class="text-gray-200">جاري مسح منافذ USB على الراوتر...</p>
            </div>
            <span class="text-sm text-gray-400">يرجى الانتظار</span>
        </div>

        <!-- شبكة عرض الملفات المكتشفة -->
        <div id="mediaGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
            <!-- الكروت ستتم إضافتها هنا برمجياً بواسطة ui.js -->
        </div>

        <!-- رسالة حالة عدم وجود ملفات -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-20 opacity-70">
            <i class="fa-solid fa-folder-open text-6xl mb-4 text-gray-500"></i>
            <h2 class="text-xl font-semibold">لم يتم العثور على ملفات فيديو</h2>
            <p class="text-gray-400 mt-2">تأكد من توصيل الفلاشة بالراوتر وأن الملفات بصيغة مدعومة.</p>
        </div>
    </main>

    <!-- مشغل الفيديو المنبثق (Modal) -->
    <div id="playerModal"
        class="fixed inset-0 z-[100] hidden bg-black/95 backdrop-blur-md flex flex-col items-center justify-center opacity-0 transition-opacity duration-300">
        <!-- زر الإغلاق -->
        <button id="closePlayerBtn"
            class="absolute top-6 right-6 text-white hover:text-red-500 transition text-3xl z-50">
            <i class="fa-solid fa-times-circle"></i>
        </button>

        <!-- عنوان الفيديو -->
        <h2 id="nowPlayingTitle" class="absolute top-8 left-6 text-xl font-semibold text-gray-300">...</h2>

        <!-- المشغل -->
        <div class="w-full max-w-6xl aspect-video glass-panel overflow-hidden shadow-2xl relative group">
            <!-- سنقوم بتخصيص مشغل HTML5 في ملف player.js -->
            <video id="mainVideoPlayer" class="w-full h-full outline-none" controls playsinline>
                <source src="" type="video/mp4">
                متصفحك لا يدعم مشغل الفيديو.
            </video>
        </div>
    </div>

    <!-- استدعاء ملف الـ App الرئيسي كـ Module لربط جميع الملفات -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
