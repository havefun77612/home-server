<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUEZ Hub | Production</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-[#05070a] text-slate-100 min-h-screen">

    <nav class="sticky top-0 z-50 bg-[#080b12]/90 backdrop-blur-xl border-b border-white/5 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-600/20">
                    <i data-lucide="play" class="text-white fill-current w-5 h-5"></i>
                </div>
                <h1 class="text-2xl font-black italic tracking-tighter uppercase">Suez<span class="text-blue-500">Stream</span></h1>
            </div>
            <div class="flex items-center gap-2 bg-white/5 p-1 rounded-xl border border-white/10">
                <button onclick="toggleView('library')" class="px-5 py-2 rounded-lg text-sm font-bold hover:bg-white/5 transition">المكتبة</button>
                <button onclick="toggleView('browser')" class="px-5 py-2 rounded-lg text-sm font-bold hover:bg-white/5 transition">المتصفح</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        <div id="loader" class="flex flex-col items-center justify-center py-40">
            <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
            <p class="mt-6 text-slate-400 font-medium animate-pulse">جاري فحص الشبكة المحلية وتوليد البوسترات...</p>
        </div>

        <section id="librarySection">
            <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                </div>
        </section>

        <section id="browserSection" class="hidden animate-in fade-in duration-500">
            <div class="bg-slate-900/50 rounded-3xl border border-white/10 p-1">
                <iframe src="browser.html" class="w-full h-[75vh] rounded-[22px]"></iframe>
            </div>
        </section>
    </main>

    <div id="playerModal" class="fixed inset-0 bg-black/98 hidden z-[100] flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-5xl">
            <div class="flex justify-between items-center mb-4 px-2">
                <div>
                    <h2 id="playerTitle" class="text-2xl font-bold text-white"></h2>
                    <p id="playerDesc" class="text-slate-400 text-xs mt-1 line-clamp-1"></p>
                </div>
                <button onclick="closePlayer()" class="w-10 h-10 flex items-center justify-center bg-white/10 hover:bg-red-600 rounded-full transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <video id="mainPlayer" controls class="w-full rounded-2xl shadow-2xl bg-black aspect-video border border-white/5"></video>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/core.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
