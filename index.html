<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUEZ Hub | Auto Discover</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-[#05070a] text-slate-100 font-sans">

    <nav class="sticky top-0 z-50 bg-[#05070a]/90 backdrop-blur-md border-b border-white/5 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center">
                    <i data-lucide="monitor-play" class="text-white w-5 h-5"></i>
                </div>
                <h1 class="text-xl font-black tracking-tighter">SUEZ<span class="text-blue-500">STREAM</span></h1>
            </div>
            <div class="flex gap-6">
                <button onclick="toggleView('library')" class="text-sm font-bold hover:text-blue-500 transition">المكتبة</button>
                <button onclick="toggleView('browser')" class="text-sm font-bold hover:text-blue-500 transition">المتصفح</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        <div id="loader" class="flex flex-col items-center justify-center py-32">
            <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
            <p class="mt-4 text-slate-400 font-bold">جاري مسح الفلاشة واستخراج البوسترات...</p>
        </div>

        <section id="librarySection">
            <div id="movieGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                </div>
        </section>

        <section id="browserSection" class="hidden h-[80vh] rounded-3xl overflow-hidden border border-white/10 shadow-2xl">
            <iframe src="browser.html" class="w-full h-full bg-white"></iframe>
        </section>
    </main>

    <div id="playerModal" class="fixed inset-0 bg-black/98 hidden z-[100] flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-5xl">
            <div class="flex justify-between items-center mb-4 px-2">
                <h2 id="playerTitle" class="text-xl font-bold truncate max-w-[70%]"></h2>
                <button onclick="closePlayer()" class="bg-white/10 hover:bg-red-600 px-4 py-2 rounded-full transition text-sm">إغلاق</button>
            </div>
            <video id="mainPlayer" controls class="w-full rounded-2xl shadow-2xl aspect-video bg-black border border-white/5"></video>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/core.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
