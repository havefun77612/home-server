<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-[#0b0f19] text-white p-8 overflow-hidden">
    <div class="text-center mb-12">
        <h2 class="text-4xl font-black mb-3">المتصفح السريع</h2>
        <p class="text-slate-400 text-sm">بوابتك للوصول لأي موقع بجانب مكتبتك المحلية</p>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-6 max-w-5xl mx-auto">
        <a href="https://www.google.com" target="_blank" class="group p-8 bg-white/5 rounded-3xl border border-white/5 hover:border-blue-500/50 hover:bg-blue-600/10 transition-all text-center">
            <div class="text-3xl mb-4 group-hover:scale-110 transition-transform">🔍</div>
            <span class="font-bold">Google</span>
        </a>
        <a href="https://www.youtube.com" target="_blank" class="group p-8 bg-white/5 rounded-3xl border border-white/5 hover:border-red-500/50 hover:bg-red-600/10 transition-all text-center">
            <div class="text-3xl mb-4 group-hover:scale-110 transition-transform">📺</div>
            <span class="font-bold">YouTube</span>
        </a>
        <a href="http://192.168.100.1" target="_blank" class="group p-8 bg-white/5 rounded-3xl border border-white/5 hover:border-orange-500/50 hover:bg-orange-600/10 transition-all text-center">
            <div class="text-3xl mb-4 group-hover:scale-110 transition-transform">⚙️</div>
            <span class="font-bold">الراوتر</span>
        </a>
        <a href="https://www.facebook.com" target="_blank" class="group p-8 bg-white/5 rounded-3xl border border-white/5 hover:border-blue-700/50 hover:bg-blue-800/10 transition-all text-center">
            <div class="text-3xl mb-4 group-hover:scale-110 transition-transform">👥</div>
            <span class="font-bold">Facebook</span>
        </a>
    </div>

    <div class="mt-12 max-w-2xl mx-auto">
        <div class="relative">
            <input type="text" placeholder="ابحث في جوجل مباشرة..." id="gSearch" 
                class="w-full bg-white/5 border border-white/10 rounded-full py-4 px-8 outline-none focus:border-blue-500 transition shadow-2xl">
            <button onclick="window.open('https://www.google.com/search?q=' + document.getElementById('gSearch').value)" 
                class="absolute left-3 top-2 bottom-2 bg-blue-600 px-6 rounded-full font-bold text-sm">بحث</button>
        </div>
    </div>
</body>
</html>
